[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hush"
version = "2.0.0"
requires-python = ">=3.13"
dependencies = [
    "Pillow>=10.0",
    "torch>=2.5",
    "torchvision>=0.20",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "numpy>=2.0",
    "tqdm>=4.0",
    "fastapi>=0.110",
    "python-multipart>=0.0.6",
    "uvicorn[standard]>=0.27",
    "PyQt6>=6.6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.11", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
