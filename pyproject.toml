[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hush"
version = "1.1.0"
requires-python = ">=3.13"
dependencies = [
    "Pillow>=10.0",
    "torch>=2.5",
    "torchvision>=0.20",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "numpy>=2.0",
    "tqdm>=4.0",
    "flask>=3.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
