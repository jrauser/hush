<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 240px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    color: #333;
    padding: 12px;
  }
  h1 { font-size: 15px; margin-bottom: 10px; }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
  }
  .label { color: #666; }
  .value { font-weight: 600; }
  .connected { color: #27ae60; }
  .disconnected { color: #c0392b; }
  .muted { color: #c0392b; }
  .unmuted { color: #27ae60; }
  .btn {
    width: 100%;
    margin-top: 10px;
    padding: 8px;
    border: none;
    border-radius: 6px;
    color: white;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #enable-btn { background: #27ae60; }
  #enable-btn:hover { background: #219a52; }
  #enable-btn.disable { background: #c0392b; }
  #enable-btn:hover.disable { background: #a93226; }
  #unmute-btn {
    display: none;
    background: #27ae60;
  }
  #unmute-btn:hover { background: #219a52; }
</style>
</head>
<body>
  <h1>Hush</h1>
  <div class="row">
    <span class="label">Connection</span>
    <span id="connection" class="value">--</span>
  </div>
  <div class="row">
    <span class="label">Mode</span>
    <span id="mode" class="value">--</span>
  </div>
  <div class="row">
    <span class="label">Interval</span>
    <span id="interval" class="value">--</span>
  </div>
  <div class="row">
    <span class="label">Audio</span>
    <span id="audio" class="value">--</span>
  </div>
  <button id="enable-btn" class="btn">Enable</button>
  <button id="unmute-btn" class="btn">Unmute</button>
  <script src="popup.js"></script>
</body>
</html>
